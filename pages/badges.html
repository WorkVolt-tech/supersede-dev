<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSede — Badges</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    /* ══════════════════════════════════════════════
       SUPERSEDE DARK THEME — Gold / Amber accent
       Injected over main.css — no JS touched.
    ══════════════════════════════════════════════ */
        :root {
      --bg-0:      #14110f;
      --bg-1:      #2b1d16;
      --panel:     #f4ead7;
      --page-l:    #f4ead7;
      --page-r:    #f1e4cf;
      --ink:       #2b1d16;
      --ink-dim:   #5c4638;
      --ink-faint: #a08060;
      --ice:       #7a5230;
      --ice-hot:   #4b2e14;
      --gold:      #c8a050;
      --gold-hot:  #e0c070;
      --gold-dim:  #a08040;
      --amber:     #d09040;
      --amber-hot: #e0a050;
      --warn:      #e06050;
      --line:      rgba(200,160,80,.30);
      --green:     #5cae50;
      --purple:    #8a50c0;
      --spine-col: #2b1d16;
    }
    *, *::before, *::after { box-sizing:border-box; }
        html, body {
      background: radial-gradient(ellipse at 50% 0%, #2a1a0e 0%, #14110f 55%, #0d0b09 100%) !important;
      color: var(--ink) !important;
      font-family: 'Cormorant Garamond', Georgia, serif !important;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9998;
      background: radial-gradient(ellipse 900px 900px at 50% 40%, rgba(180,120,60,.07) 0%, transparent 70%);
    }
        /* ── BOOK — parchment open-book ── */
    .book, .craft-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      align-items: stretch !important;
      gap: 0 !important;
      background: transparent !important;
      border: 1px solid rgba(138,91,68,.30) !important;
      box-shadow: none !important;
      border-radius: 24px !important;
      filter: drop-shadow(0 24px 60px rgba(0,0,0,.75)) drop-shadow(0 8px 20px rgba(0,0,0,.5)) !important;
      transform: perspective(1600px) rotateX(2.5deg) !important;
      transform-origin: 50% 0 !important;
      margin-top: 10px !important;
      overflow: hidden !important;
    }
    @media(max-width:860px){
      .book, .craft-grid { grid-template-columns:1fr !important; transform:none !important; border-radius:12px !important; }
    }
    /* ── PAGES ── */
    .parchment, .page-left, .page-right {
      background: var(--panel) !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      color: var(--ink) !important;
      position: relative;
      overflow-y: auto; overflow-x: hidden;
    }
    .page-left  { background: var(--page-l) !important; border-right: none !important; }
    .page-right { background: var(--page-r) !important; border-left:  none !important; }
    /* dot-texture grain */
    .page-left::before, .page-right::before {
      content: "" !important; position: absolute !important; inset: 0 !important;
      pointer-events: none !important; z-index: 0 !important; opacity: .08 !important;
      background-image: radial-gradient(circle, rgba(0,0,0,.25) 1px, transparent 1px) !important;
      background-size: 12px 12px !important;
    }
    /* spine-edge shadows */
    .page-left::after {
      content: "" !important;
      position: absolute !important;
      top: 0 !important; bottom: 0 !important; right: 0 !important;
      width: 60px !important;
      background: linear-gradient(to right, transparent 0%, rgba(100,60,10,.08) 40%, rgba(60,30,5,.22) 100%) !important;
      pointer-events: none !important;
      z-index: 2 !important;
    }
    .page-right::after {
      content: "" !important;
      position: absolute !important;
      top: 0 !important; bottom: 0 !important; left: 0 !important;
      width: 60px !important;
      background: linear-gradient(to left, transparent 0%, rgba(100,60,10,.08) 40%, rgba(60,30,5,.22) 100%) !important;
      pointer-events: none !important;
      z-index: 2 !important;
    }
    /* corner brackets */
    .page-inner { padding: 28px 30px !important; position: relative; }
    .page-inner::before {
      content: "" !important; position: absolute !important;
      top: 14px !important; left: 14px !important; width: 28px !important; height: 28px !important;
      border-left: 1.5px solid rgba(138,91,68,.45) !important;
      border-top: 1.5px solid rgba(138,91,68,.45) !important;
      pointer-events: none !important;
    }
    .page-inner::after {
      content: "" !important; position: absolute !important;
      bottom: 14px !important; right: 14px !important; width: 28px !important; height: 28px !important;
      border-right: 1.5px solid rgba(138,91,68,.45) !important;
      border-bottom: 1.5px solid rgba(138,91,68,.45) !important;
      pointer-events: none !important;
    }
    /* ── SPINE ── */
    .spine {
      background: linear-gradient(180deg, #14120a 0%, #0e0c06 50%, #14120a 100%) !important;
      border-left:  1px solid #2a2412 !important;
      border-right: 1px solid #2a2412 !important;
      position: relative; z-index: 5; width: 20px !important;
      box-shadow: inset 2px 0 5px rgba(0,0,0,.5), inset -2px 0 5px rgba(0,0,0,.5) !important;
    }
    .spine::before {
      content:""; position:absolute; top:0; left:50%; width:1px; height:100%;
      background:linear-gradient(180deg,transparent,rgba(200,168,74,.12) 30%,rgba(200,168,74,.12) 70%,transparent);
    }
    /* ── TYPOGRAPHY ── */
    .chapter-label, .page-label {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 9.5px !important; letter-spacing: .42em !important;
      text-transform: uppercase !important;
      color: var(--gold) !important; margin-bottom: 5px !important;
    }
    .page-title, h1.page-title, h2.page-title {
      font-family: 'Cormorant Garamond', serif !important;
      font-size: 22px !important; font-weight: 500 !important;
      letter-spacing: .04em !important; color: var(--ink) !important;
      margin-bottom: 14px !important;
    }
    .ink-divider, hr.ink-divider {
      border: none !important; border-top: 1px solid var(--line) !important;
      margin: 12px 0 !important; opacity: 1 !important;
    }
    /* body text */
    p, li, span { color: var(--ink) !important; }
    /* ── INLINE COLOURS — remap parchment browns to gold tones ── */
    [style*="color:var(--ink)"] { color: var(--ink) !important; }
    [style*="color:var(--ink-dim)"] { color: var(--ink-dim) !important; }
    [style*="color:var(--ink-dim)"] { color: var(--gold-dim) !important; }
    [style*="color:var(--ink-dim)"] { color: var(--gold-dim) !important; }
    [style*="color:#c8b96e"] { color: var(--gold) !important; }
    [style*="background:rgba(200,184,128"] { background: rgba(200,168,74,.08) !important; }
    [style*="border-color:rgba(139,106,32"] { border-color: rgba(200,168,74,.25) !important; }
    /* ── BUTTONS / CHOICES ── */
    /* ── STAT BARS ── */
    .stat-bar-wrap { background: rgba(255,255,255,.06) !important; border-radius:0 !important; }
    .stat-key { color: var(--ink-dim) !important; font-family:'JetBrains Mono',monospace !important; font-size:.58rem !important; letter-spacing:.08em !important; }
    .stat-val { color: var(--ink) !important; }
    /* ── MODALS / OVERLAYS ── */
    [id$="-window"] > div, .end-box {
      background: var(--panel) !important;
      border: 1px solid var(--line) !important;
      border-radius: 0 !important;
    }
    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:var(--bg-0)}
    ::-webkit-scrollbar-thumb{background:var(--line)}
    ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}
    /* ── ANIMATE-IN ── */
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .animate-in{animation:fadeIn .4s ease forwards}
      /* ── Book wrap ── */
    .book-wrap, .craft-grid-wrap {
      background: transparent !important;
      max-width: 1060px;
      margin: 0 auto;
      padding: 24px 24px 60px;
    }
    /* ── Book ── */
    .book, .craft-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      align-items: stretch !important;
      gap: 0 !important;
      background: transparent !important;
      border: 1px solid rgba(138,91,68,.30) !important;
      box-shadow: none !important;
      border-radius: 24px !important;
      filter: drop-shadow(0 24px 60px rgba(0,0,0,.75)) drop-shadow(0 8px 20px rgba(0,0,0,.5)) !important;
      transform: perspective(1600px) rotateX(2.5deg) !important;
      transform-origin: 50% 0 !important;
      margin-top: 10px !important;
      overflow: hidden !important;
    }
    @media(max-width:860px) {
      .book, .craft-grid { grid-template-columns: 1fr !important; transform: none !important; border-radius: 12px !important; }
    }
    /* ── Pages ── */
    .parchment, .page-left, .page-right {
      background: var(--panel) !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      color: var(--ink) !important;
      position: relative;
      overflow-y: auto; overflow-x: hidden;
    }
    .page-left::before, .page-right::before {
      content: "" !important; position: absolute !important; inset: 0 !important;
      pointer-events: none !important; z-index: 0 !important; opacity: .08 !important;
      background-image: radial-gradient(circle, rgba(0,0,0,.25) 1px, transparent 1px) !important;
      background-size: 12px 12px !important;
    }
    .page-left  { border-right: none !important; background: var(--page-l) !important; }
    .page-right { border-left:  none !important; background: var(--page-r) !important; }
    .page-left::after {
      content: "" !important;
      position: absolute !important;
      top: 0 !important; bottom: 0 !important; right: 0 !important;
      width: 60px !important;
      background: linear-gradient(to right, transparent 0%, rgba(100,60,10,.08) 40%, rgba(60,30,5,.22) 100%) !important;
      pointer-events: none !important;
      z-index: 2 !important;
    }
    .page-right::after {
      content: "" !important;
      position: absolute !important;
      top: 0 !important; bottom: 0 !important; left: 0 !important;
      width: 60px !important;
      background: linear-gradient(to left, transparent 0%, rgba(100,60,10,.08) 40%, rgba(60,30,5,.22) 100%) !important;
      pointer-events: none !important;
      z-index: 2 !important;
    }
    .page-inner { padding: 28px 30px !important; position: relative; }
    .page-inner::before {
      content: "" !important; position: absolute !important;
      top: 14px !important; left: 14px !important; width: 28px !important; height: 28px !important;
      border-left: 1.5px solid rgba(138,91,68,.45) !important;
      border-top: 1.5px solid rgba(138,91,68,.45) !important;
      pointer-events: none !important;
    }
    .page-inner::after {
      content: "" !important; position: absolute !important;
      bottom: 14px !important; right: 14px !important; width: 28px !important; height: 28px !important;
      border-right: 1.5px solid rgba(138,91,68,.45) !important;
      border-bottom: 1.5px solid rgba(138,91,68,.45) !important;
      pointer-events: none !important;
    }
    /* ── Spine ── */
    .spine {
      background: linear-gradient(90deg,
        rgba(0,0,0,.0) 0%, rgba(0,0,0,.20) 28%, rgba(0,0,0,.40) 46%,
        rgba(0,0,0,.50) 50%, rgba(0,0,0,.40) 54%, rgba(0,0,0,.20) 72%, rgba(0,0,0,.0) 100%
      ) !important;
      border: none !important; position: relative; z-index: 5;
      width: 22px !important; min-width: 22px !important;
      margin: 0 !important; overflow: visible; box-shadow: none !important;
    }
    .spine::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, transparent 0%, rgba(43,29,22,.9) 8%, rgba(43,29,22,.9) 92%, transparent 100%);
      z-index: 2;
    }
    .spine-inner, .spine-highlight, .spine-shadow,
    .spine-title, .spine-rule, .spine-diamond, .spine-chapter { display: none !important; }
    /* ── Text & UI colours ── */
    h1, h2, h3, h4, h5, h6 { color: var(--ink) !important; }
    .book p, .book li, .book span, .book label,
    .book-wrap p, .book-wrap li, .book-wrap span, .book-wrap label { color: var(--ink) !important; }
    input, select, textarea { background: rgba(43,29,22,.06) !important; border: 1px solid rgba(138,91,68,.35) !important; color: var(--ink) !important; border-radius: 0 !important; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(43,29,22,.15); }
    ::-webkit-scrollbar-thumb { background: rgba(138,91,68,.35); }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }
  
    @media (max-width: 800px) {
      .book, .book-body, .craft-grid { flex-direction: column !important; min-height: auto; }
      .page-left, .page-right { width: 100% !important; padding: 20px 16px !important; }
      .book-wrap, .craft-grid-wrap { padding: 8px 12px 40px !important; }
    }
  </style>

</head>
<body>
<div id="nav"></div>
<div class="book-wrap">
  
  <div class="book animate-in">
    <div class="page-left parchment">
      <div class="page-inner">
        <p class="chapter-label">Hall of Records</p>
        <h1 class="page-title">Earned Seals</h1>
        <p id="earned-count" style="font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--ink-dim);letter-spacing:.06em;margin-bottom:.5rem"></p>
        <hr class="ink-divider">
        <div id="earned-seals" style="display:grid;grid-template-columns:repeat(2,1fr);gap:1rem"></div>
        <p id="no-badges" style="display:none;font-family:'IM Fell English',serif;font-style:italic;font-size:.88rem;color:var(--ink-dim)">No seals earned yet. Complete Chapter 1 to begin.</p>
      </div>
    </div>
        <div class="page-right parchment">
      <div class="page-inner">
        <p class="chapter-label">Sealed Records</p>
        <h2 class="page-title">In Progress</h2>
        <hr class="ink-divider">
        <div id="locked-badges"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { supabase }  from '../supabase.js'
  import { renderNav } from '../components/nav.js'

  const player = await renderNav('nav')
  if (!player) throw new Error('no player')

  const ALL_BADGES = [
    {key:'survivor',      name:'Survivor',      icon:'🟡', rarity:'common',    desc:'Complete Chapter 1.',           ctype:'chapter', cval:1 },
    {key:'helper',        name:'Helper',        icon:'🟢', rarity:'uncommon',  desc:'Help 3 players.',               ctype:'helps',   cval:3 },
    {key:'hunter',        name:'Hunter',        icon:'🔴', rarity:'uncommon',  desc:'Defeat 5 players in PvP.',      ctype:'kills',   cval:5 },
    {key:'watcher_slain', name:'Watcher Slain', icon:'👁', rarity:'rare',      desc:'Defeat The Watcher.',           ctype:'boss',    cval:1 },
    {key:'elite',         name:'Elite',         icon:'🟣', rarity:'epic',      desc:'Reach level 10.',               ctype:'level',   cval:10},
    {key:'unknown',       name:'Unknown',       icon:'⚫', rarity:'legendary', desc:'????? hidden conditions ?????',  ctype:'hidden',  cval:0 },
  ]
  const RC = {common:'#c8c8c8',uncommon:'#5ec45e',rare:'#5eaee0',epic:'#a07de0',legendary:'#c8b96e'}


  const defeated = player.defeated_bosses || []
  const {data:earnedRows} = await supabase.from('player_badges').select('badge_key,earned_at').eq('player_id',player.id)
  const earnedKeys = new Set((earnedRows||[]).map(b=>b.badge_key))

  // ── Auto-award badges based on current player stats ──
  function hasEarned(b) {
    switch(b.ctype) {
      case 'chapter': return (player.chapters_unlocked||[]).includes(2) || (player.current_chapter||1) >= 2
      case 'level':   return (player.level||1) >= b.cval
      case 'helps':   return (player.helps_given||0) >= b.cval
      case 'kills':   return (player.pvp_kills||0) >= b.cval
      case 'boss':    return defeated.some(k => k.includes('watcher'))
      case 'hidden':  return false
      default:        return false
    }
  }

  function getProgress(b) {
    switch(b.ctype) {
      case 'chapter': return (player.chapters_unlocked||[]).includes(2) ? 1 : 0
      case 'level':   return Math.min(b.cval, player.level||1)
      case 'helps':   return Math.min(b.cval, player.helps_given||0)
      case 'kills':   return Math.min(b.cval, player.pvp_kills||0)
      case 'boss':    return defeated.some(k=>k.includes('watcher')) ? 1 : 0
      default:        return 0
    }
  }

  // Insert any newly earned badges not yet recorded
  for (const b of ALL_BADGES) {
    if (!earnedKeys.has(b.key) && hasEarned(b)) {
      const {error} = await supabase.from('player_badges').insert({
        player_id: player.id,
        badge_key:  b.key,
        earned_at:  new Date().toISOString(),
      })
      if (!error) earnedKeys.add(b.key)
    }
  }

  const earned = ALL_BADGES.filter(b => earnedKeys.has(b.key))
  const locked  = ALL_BADGES.filter(b => !earnedKeys.has(b.key))

  document.getElementById('earned-count').textContent = `${earned.length} of ${ALL_BADGES.length} seals obtained`

  if (!earned.length) {
    document.getElementById('no-badges').style.display = 'block'
  } else {
    document.getElementById('earned-seals').innerHTML = earned.map(b => `
      <div class="seal">
        <div class="seal-wax" style="border-color:${RC[b.rarity]}80;box-shadow:0 0 12px ${RC[b.rarity]}40">
          <span class="seal-emoji">${b.icon}</span>
          <div class="seal-ring" style="border-color:${RC[b.rarity]}40"></div>
        </div>
        <p class="seal-name" style="color:${RC[b.rarity]}">${b.name}</p>
        <p class="seal-desc">${b.desc}</p>
        <p style="font-family:'Share Tech Mono',monospace;font-size:.55rem;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase">${b.rarity}</p>
      </div>
    `).join('')
  }

  document.getElementById('locked-badges').innerHTML = locked.map(b => {
    const prog   = b.cval > 0 ? Math.min(1, getProgress(b) / b.cval) : 0
    const rc     = RC[b.rarity]
    const hidden = b.ctype === 'hidden'
    return `
      <div style="display:flex;align-items:flex-start;gap:.75rem;padding:.8rem 0;border-bottom:.5px solid var(--line);opacity:.7">
        <span style="font-size:1.5rem;filter:grayscale(.7);flex-shrink:0">${b.icon}</span>
        <div style="flex:1;min-width:0">
          <p style="font-family:'Cinzel',serif;font-size:.82rem;color:var(--ink);margin:0 0 2px">${b.name}</p>
          <p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.75rem;color:var(--ink-dim);margin:0 0 5px">${hidden ? '?????' : b.desc}</p>
          ${!hidden ? `
            <div class="prog-bar"><div class="prog-fill" style="width:${prog*100}%;background:${rc}"></div></div>
            <p style="font-family:'Share Tech Mono',monospace;font-size:.55rem;color:var(--ink-dim);letter-spacing:.06em">${getProgress(b)} / ${b.cval}</p>
          ` : ''}
        </div>
        <span style="font-family:'Share Tech Mono',monospace;font-size:.55rem;border:.5px solid ${rc}40;border-radius:20px;padding:1px 6px;letter-spacing:.08em;color:${rc};flex-shrink:0;margin-top:2px">${b.rarity}</span>
      </div>
    `
  }).join('')
</script>
</body>
</html>
