<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSede — Chapters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0:      #14110f;
      --bg-1:      #2b1d16;
      --panel:     #f4ead7;
      --page-l:    #f4ead7;
      --page-r:    #f1e4cf;
      --ink:       #2b1d16;
      --ink-dim:   #5c4638;
      --ink-faint: #a08060;
      --ice:       #7a5230;
      --ice-hot:   #4b2e14;
      --gold:      #c8a050;
      --gold-hot:  #e0c070;
      --gold-dim:  #a08040;
      --amber:     #d09040;
      --amber-hot: #e0a050;
      --warn:      #e06050;
      --line:      rgba(200,160,80,.30);
      --green:     #5cae50;
      --purple:    #8a50c0;
      --spine-col: #2b1d16;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      min-height:100vh;
      background: radial-gradient(ellipse at 50% 0%, #2a1a0e 0%, #14110f 55%, #0d0b09 100%);
      color:var(--ink);
      font-family:'Cormorant Garamond',serif;
      overflow-x:hidden;
    }

    /* scanlines */
    body::after {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:9998;
      background-image: repeating-linear-gradient(180deg,
        rgba(200,168,74,.010) 0px, rgba(200,168,74,.010) 1px,
        transparent 1px, transparent 4px);
    }

    /* ── OUTER WRAPPER ── */
    .scene {
      max-width:1060px;
      margin:0 auto;
      padding:10px 24px 60px;
    }
    @media (max-width: 800px) {
      .scene { padding: 8px 12px 40px; }
      .book-body { flex-direction: column; min-height: auto; }
      .page-left, .page-right { width: 100%; padding: 20px 16px; }
      .spine { display: none; }
      .zone { flex-direction: column; gap: 8px; }
      .z-sub { text-align: left; max-width: 100%; }
      .stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .action-row { gap: 6px; }
    }

    /* zone header */
    .zone {
      display:flex; align-items:baseline; justify-content:space-between;
      padding:20px 0 22px; gap:24px;
    }
    .z-kicker { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.42em; color:var(--gold); text-transform:uppercase; }
    .z-title  { font-size:22px; font-weight:500; letter-spacing:.04em; color:#d4c5a0; margin-top:4px; }
    .z-sub    { font-size:14px; color:#a09070; font-style:italic; text-align:right; line-height:1.5; max-width:340px; }

    /* ══════════════════════════════
       BOOK SHELL — 3D perspective
    ══════════════════════════════ */
    .book-shell {
      perspective: 1800px;
      perspective-origin: 50% 42%;
    }

    .book-body {
      display: flex;
      align-items: stretch;
      min-height: 560px;
      position: relative;
      transform: rotateX(3deg);
      transform-style: preserve-3d;
      filter: drop-shadow(0 28px 60px rgba(0,0,0,.85));
    }

    /* cover boards removed */
    .book-body::before, .book-body::after { display:none; }

    /* ── LEFT PAGE ── */
    .page-left {
      flex: 1;
      background: var(--page-l);
      border: 1px solid var(--line);
      border-right: none;
      padding: 32px 28px 32px 32px;
      position: relative;
      overflow: hidden;
    }
    /* subtle inner gradient — lit from spine */
    .page-left::before {
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(90deg, rgba(180,120,60,.04) 0%, transparent 60%);
      pointer-events:none;
    }
    /* page-curl shadow cast inward from the binding — left page */
    .page-left::after {
      content:"";
      position:absolute; top:0; bottom:0; right:0;
      width:36px; height:auto;
      border:none;
      background: linear-gradient(270deg,
        rgba(0,0,0,.30) 0%,
        rgba(0,0,0,.10) 55%,
        transparent 100%);
      pointer-events:none;
      z-index:2;
    }
    .page-left .corner-br {
      position:absolute; bottom:-1px; left:-1px;
      width:18px; height:18px;
      border-bottom:1px solid var(--gold); border-left:1px solid var(--gold);
    }

    /* ── SPINE — open book gutter / inner binding ── */
    .spine {
      width: 22px;
      flex-shrink: 0;
      background: linear-gradient(90deg,
        rgba(0,0,0,.0)  0%,
        rgba(0,0,0,.32) 28%,
        rgba(0,0,0,.55) 46%,
        rgba(0,0,0,.62) 50%,
        rgba(0,0,0,.55) 54%,
        rgba(0,0,0,.32) 72%,
        rgba(0,0,0,.0)  100%
      );
      border-left:  none;
      border-right: none;
      position: relative;
      z-index: 5;
      box-shadow: none;
    }
    /* hairline crease at centre */
    .spine::before {
      content:"";
      position:absolute;
      top:0; bottom:0;
      left:50%;
      width:1px;
      transform:translateX(-50%);
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(43,29,22,.9) 8%,
        rgba(43,29,22,.9) 92%,
        transparent 100%);
    }
    /* stacked page edge on left side */
    .spine::after {
      content:"";
      position:absolute;
      top:2px; bottom:2px; left:-3px;
      width:3px;
      background: repeating-linear-gradient(
        180deg,
        rgba(138,91,68,.08) 0px,
        rgba(138,91,68,.03) 1px,
        rgba(0,0,0,.15)      1px,
        rgba(0,0,0,.05)      2px
      );
      border-left:1px solid rgba(138,91,68,.12);
    }

    /* ── RIGHT PAGE ── */
    .page-right {
      flex: 1;
      background: var(--page-r);
      border: 1px solid var(--line);
      border-left: none;
      padding: 32px 32px 32px 28px;
      position: relative;
      overflow: hidden;
    }
    .page-right::before {
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(270deg, rgba(180,120,60,.03) 0%, transparent 60%);
      pointer-events:none;
    }
    /* page-curl shadow cast inward from the binding — right page */
    .page-right::after {
      content:"";
      position:absolute; top:0; bottom:0; left:0;
      width:36px; height:auto;
      border:none;
      background: linear-gradient(90deg,
        rgba(0,0,0,.30) 0%,
        rgba(0,0,0,.10) 55%,
        transparent 100%);
      pointer-events:none;
      z-index:2;
    }
    .page-right .corner-tr {
      position:absolute; top:-1px; right:-1px;
      width:18px; height:18px;
      border-top:1px solid var(--gold); border-right:1px solid var(--gold);
    }
    .page-right .corner-br {
      position:absolute; bottom:-1px; right:-1px;
      width:18px; height:18px;
      border-bottom:1px solid var(--gold); border-right:1px solid var(--gold);
    }

    /* ── LEFT PAGE CONTENT ── */
    .page-label {
      font-family:'JetBrains Mono',monospace;
      font-size:9.5px; letter-spacing:.42em; text-transform:uppercase;
      color:var(--gold); margin-bottom:6px;
    }
    .page-title {
      font-size:22px; font-weight:500; letter-spacing:.04em;
      color:var(--ink); margin-bottom:18px;
    }
    .ink-rule {
      border:none;
      border-top:1px solid var(--line);
      margin:16px 0;
    }

    /* chapter entries */
    .chapter-entry {
      display:flex; align-items:center; gap:16px;
      padding:16px 0; border-bottom:1px solid var(--line);
      cursor:default;
    }
    .chapter-entry:last-child { border-bottom:none; }
    .chapter-entry.locked { opacity:.38; }

    /* Watcher thumbnail */
    .ch-thumb {
      width:68px; height:68px; flex-shrink:0;
      border:1px solid var(--line);
      background: radial-gradient(ellipse at 50% 38%, #0e2030 0%, #04080e 60%, #020305 100%);
      overflow:hidden; position:relative;
      transition:border-color .25s;
    }
    .chapter-entry:not(.locked):hover .ch-thumb { border-color:var(--gold); }
    .ch-thumb svg { width:100%; height:100%; display:block; }

    .ch-info { flex:1; min-width:0; }
    .ch-title { font-size:18px; font-weight:500; color:var(--ink); letter-spacing:.03em; line-height:1.2; }
    .ch-sub   { font-style:italic; font-size:13.5px; color:var(--ink-dim); margin-top:3px; }
    .ch-sealed{
      font-family:'JetBrains Mono',monospace; font-size:9px;
      letter-spacing:.28em; color:var(--ink-faint); text-transform:uppercase;
    }
    .ch-btn {
      font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.26em;
      text-transform:uppercase; color:var(--ink); background:transparent;
      border:1px solid var(--line); padding:6px 12px; text-decoration:none;
      transition:border-color .2s, color .2s, background .2s;
      white-space:nowrap; flex-shrink:0;
    }
    .ch-btn:hover, .ch-btn.active {
      border-color:var(--gold); color:var(--gold);
      background:rgba(200,168,74,.05);
    }

    /* boot terminal */
    .boot {
      border:1px solid rgba(200,168,74,.3);
      background:rgba(8,16,26,.75);
      padding:12px 14px;
      font-family:'JetBrains Mono',monospace;
      font-size:10px; letter-spacing:.06em;
      color:var(--ice-hot); line-height:1.7;
      margin-top:18px;
    }
    .bline { opacity:0; animation:bpop .3s ease forwards; }
    @keyframes bpop { from{opacity:0;transform:translateX(-4px)} to{opacity:1;transform:none} }
    .bline:nth-child(1){animation-delay:.3s}
    .bline:nth-child(2){animation-delay:.9s}
    .bline:nth-child(3){animation-delay:1.5s}
    .bline:nth-child(4){animation-delay:2.1s}
    .bline:nth-child(5){animation-delay:2.7s;color:var(--amber);font-weight:700;letter-spacing:.12em}
    .bline:nth-child(6){animation-delay:3.3s;color:var(--ink-dim)}
    .bcursor{display:inline-block;width:7px;height:11px;background:var(--ice-hot);vertical-align:middle;animation:blink 1s steps(2) infinite;margin-left:2px}
    @keyframes blink{50%{opacity:0}}

    /* ── RIGHT PAGE CONTENT ── */
    .rec-label {
      font-family:'JetBrains Mono',monospace;
      font-size:9.5px; letter-spacing:.42em; text-transform:uppercase;
      color:var(--gold); margin-bottom:6px;
    }
    .rec-name {
      font-size:24px; font-weight:500; letter-spacing:.05em;
      color:var(--ink); margin-bottom:18px;
    }

    .stat-grid {
      display:grid; grid-template-columns:1fr 1fr;
      gap:14px 8px; margin-bottom:20px;
    }
    .stat-cell { display:flex; flex-direction:column; }
    .stat-k {
      font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.3em;
      color:var(--ink-dim); text-transform:uppercase; margin-bottom:2px;
    }
    .stat-v { font-size:19px; font-weight:500; color:var(--ink); letter-spacing:.04em; }
    .stat-v.ice   { color:var(--gold); }
    .stat-v.amber { color:var(--amber); }
    .stat-v.green { color:var(--green); }

    .action-row { display:flex; flex-direction:column; gap:7px; }
    .action-btn {
      font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.26em;
      text-transform:uppercase; color:var(--ink-dim); background:transparent;
      border:1px solid var(--line); padding:8px 12px; text-decoration:none;
      transition:all .18s; cursor:pointer; text-align:left;
    }
    .action-btn:hover {
      border-color:var(--gold); color:var(--gold);
      background:rgba(200,168,74,.04);
    }

    .ink-quote {
      margin-top:20px;
      padding:12px 14px;
      border-left:2px solid var(--gold);
      background:rgba(200,168,74,.04);
      font-style:italic; font-size:15px; line-height:1.5; color:var(--ink);
    }
    .ink-quote .attr {
      display:block; margin-top:8px; font-style:normal;
      font-family:'JetBrains Mono',monospace;
      font-size:8.5px; letter-spacing:.3em; color:var(--ink-dim); text-transform:uppercase;
    }

    /* ── WATCHER THUMB ANIMATIONS ── */
    @keyframes wt-float  { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-5px) scale(1.01)} }
    @keyframes wt-srot   { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes wt-pMain  { 0%,100%{filter:drop-shadow(0 0 4px #ffd68a) drop-shadow(0 0 10px #ffb347)} 50%{filter:drop-shadow(0 0 9px #ffd68a) drop-shadow(0 0 22px #ffb347)} }
    @keyframes wt-pSmall { 0%,100%{filter:drop-shadow(0 0 2px #c8eeff) drop-shadow(0 0 6px #8fd8f0)} 50%{filter:drop-shadow(0 0 5px #c8eeff) drop-shadow(0 0 13px #8fd8f0)} }
    @keyframes wt-beam   { 0%,100%{transform:rotate(-8deg);opacity:.5} 50%{transform:rotate(8deg);opacity:.9} }
    .ch-thumb .wt-float    { animation:wt-float 6s ease-in-out infinite; transform-origin:50% 50%; }
    .ch-thumb .wt-srot     { animation:wt-srot 30s linear infinite; transform-origin:400px 370px; }
    .ch-thumb .wt-eye-main { animation:wt-pMain  3.6s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
    .ch-thumb .wt-eye-small{ animation:wt-pSmall 2.4s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
    .ch-thumb .wt-beam     { transform-origin:400px 420px; animation:wt-beam 5s ease-in-out infinite; }

    /* ── TWIN JUDGES THUMB ANIMATIONS ── */
    @keyframes tj-float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes tj-eyeL   { 0%,100%{filter:drop-shadow(0 0 5px #b6f0ce) drop-shadow(0 0 12px #7fd6a6)} 50%{filter:drop-shadow(0 0 10px #b6f0ce) drop-shadow(0 0 22px #7fd6a6)} }
    @keyframes tj-eyeR   { 0%,100%{filter:drop-shadow(0 0 5px #ff8a7a) drop-shadow(0 0 12px #e8564a)} 50%{filter:drop-shadow(0 0 10px #ff8a7a) drop-shadow(0 0 22px #e8564a)} }
    .ch-thumb .tj-float  { animation: tj-float 6s ease-in-out infinite; transform-origin: 50% 50%; }
    .ch-thumb .tj-eyeL   { animation: tj-eyeL 3.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .ch-thumb .tj-eyeR   { animation: tj-eyeR 3.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }

    /* scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:rgba(43,29,22,.20)}
    ::-webkit-scrollbar-thumb{background:rgba(138,91,68,.35)}

    /* ── Match inventory nav styling ── */
    button, .choice, .combat-btn {
      background: transparent !important;
      border: 1px solid var(--line) !important;
      border-radius: 0 !important;
      color: var(--ink) !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 10px !important; letter-spacing: .08em !important;
      cursor: pointer !important;
      transition: border-color .2s, color .2s, background .2s !important;
    }
    button:hover, .choice:hover, .combat-btn:hover:not(:disabled) {
      border-color: var(--gold) !important;
      color: var(--gold) !important;
      background: rgba(200,168,74,.05) !important;
    }
    .module-view {
      width: 100%;
      min-height: 100vh;
    }
    .module-loading {
      max-width: 1060px;
      margin: 24px auto 60px;
      padding: 28px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="nav"></div>

<div class="scene" id="toc-view">

  <div class="zone">
    <div>
      <div class="z-kicker">SuperSede · Archive</div>
      <div class="z-title">Table of Contents</div>
    </div>
    <div class="z-sub">Select a chapter.<br>Progress &amp; inventory are preserved.</div>
  </div>

  <!-- ══ THE BOOK ══ -->
  <div class="book-shell">
    <div class="book-body">

      <!-- LEFT PAGE — chapter list -->
      <div class="page-left">
        <div class="corner-br"></div>

        <p class="page-label">SuperSede · Chapters</p>
        <p class="page-title">Select a Chapter</p>
        <hr class="ink-rule">

        <div id="chapter-list"></div>
      </div>

      <!-- SPINE -->

      <!-- RIGHT PAGE — player record -->
      <div class="page-right">
        <div class="corner-tr"></div>
        <div class="corner-br"></div>

        <p class="rec-label">Player Record</p>
        <p class="rec-name" id="rec-username">—</p>
        <hr class="ink-rule">

        <div class="stat-grid" id="rec-stats"></div>

        <hr class="ink-rule">

        <div class="action-row">
          <a href="book.html?view=inventory" class="action-btn">🎒 Inventory</a>
          <a href="book.html?view=trader"    class="action-btn">🛒 Trader</a>
          <a href="book.html?view=lobby"     class="action-btn">⚔ Lobby</a>
          <a href="book.html?view=badges"    class="action-btn">🏅 Badges</a>
        </div>

        <div class="ink-quote">
          "Every path you walked. Every player you helped — or abandoned."
          <span class="attr">— The Watcher · Chapter 1 Finale</span>
        </div>
      </div>

    </div><!-- /book-body -->
  </div><!-- /book-shell -->

</div><!-- /scene -->

<div class="module-view" id="module-view" hidden>
  <div id="book-module-host"></div>
</div>

<script type="module">
import { supabase } from '../supabase.js'

// ── Admin config ─────────────────────────────────
// Add your Supabase user ID here to get the cloaked admin appearance in the nav
const ADMIN_USER_IDS = new Set([
  'YOUR_USER_ID_HERE',  // ← replace with your actual Supabase user ID
])

// ── Nav rendering & UI helpers ──────────────────────────────
// Was previously in components/nav.js. Inlined here because book.html is now
// the single host for the nav — every page-level view lives as a module loaded
// inside book.html via MODULE_ROUTES below. showToast and showSysOverlay are
// exposed on window so dynamically-loaded modules can use them without imports.
async function renderNav(containerId = 'nav') {
  // ── Edge-safe session check ───────────────────────────────
  // Edge delays restoring sessions from storage. We wait for
  // onAuthStateChange to fire with the real session before acting.
  const session = await new Promise(resolve => {
    let resolved = false
    const done = (s) => { if (!resolved) { resolved = true; resolve(s) } }

    // Immediate check — works in Chrome/Firefox
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) done(data.session)
      else {
        // Wait up to 2.5s for Edge to restore session from storage
        const timer = setTimeout(() => done(null), 2500)
        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, s) => {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
            clearTimeout(timer)
            subscription.unsubscribe()
            done(s)
          }
        })
      }
    })
  })

  if (!session) { location.href = '../pages/auth.html'; return null }

  const { data: player } = await supabase
    .from('players').select('*').eq('user_id', session.user.id).single()

  if (!player) { location.href = '../pages/auth.html'; return null }

  const badgeColors = { neutral:'#c8b96e', red:'#e05555', green:'#5ec45e', elite:'#a07de0', unknown:'#666' }
  const color = badgeColors[player.badge] || badgeColors.neutral

  const root = document.getElementById(containerId)
  if (!root) return player

  // Detect if we're in pages/ subfolder
  const inPages = location.pathname.includes('/pages/')
  const base = inPages ? '../' : ''

  const adminImg = ADMIN_USER_IDS.has(player.user_id)
    ? `<img src="${base}assets/mysterious_cloaked_player.png" alt="Admin" style="width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:top;border:1px solid #00ffe7;box-shadow:0 0 6px #00ffe750;vertical-align:middle;margin-right:4px;">`
    : ''

  const currentPage = location.pathname.split('/').pop()
  const currentView = new URLSearchParams(location.search).get('view') || 'chapters'

  root.innerHTML = `
    <style>
      /* ── Nav isolation — always wins over page CSS ── */
      .bm-logo, .bm-player, .bm-link, .bm-signout, .bm-sep, .bm-dot,
      .bm-top-row, .bm-mid-row, .bm-bottom-row, .bm-links, .bm-content,
      .bm-wrap, .bm-img {
        all: revert;
        box-sizing: border-box;
      }
      .bm-wrap {
        position: relative;
        width: 770px;
        height: 330px;
        margin: 0 auto;
        user-select: none;
      }
      @media (max-width: 800px) {
        .bm-wrap {
          width: 100%;
          height: auto;
          aspect-ratio: 1680 / 720;
        }
      }
      .bm-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }
      .bm-content {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 0px;
        gap: 6px;
        pointer-events: none;
      }
      .bm-content a, .bm-content button, .bm-content span { pointer-events: all; }
      .bm-top-row {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bm-mid-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .bm-bottom-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
      }
      .bm-logo {
        font-family: 'Cinzel', serif;
        font-size: 12px;
        letter-spacing: .28em;
        text-transform: uppercase;
        color: #3a2a14;
        text-decoration: none;
        flex-shrink: 0;

function showToast(msg, isErr = false) {
  let t = document.getElementById('toast')
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t) }
  t.textContent = msg
  t.className = 'toast show' + (isErr ? ' err' : '')
  clearTimeout(t._timer)
  t._timer = setTimeout(() => t.className = 'toast', 2200)
}

function showSysOverlay(msg, variant = 'warn') {
  let el = document.getElementById('sys-overlay')
  if (!el) { el = document.createElement('div'); el.id = 'sys-overlay'; document.body.appendChild(el) }
  el.className = 'sys-overlay' + (variant === 'info' ? ' info' : '')
  el.innerHTML = `<span>⚠</span><span>${msg}</span>`
  clearTimeout(el._timer)
  el._timer = setTimeout(() => el.remove(), 5000)
}

  function routeFromUrl(url) {
    const params = url.searchParams
    const chapter = params.get('chapter')
    if (chapter) return { key: `ch${chapter}`, params }

    const view = params.get('view')
    if (view) return { key: view, params }

    const file = url.pathname.split('/').pop()
    const chapterMatch = file.match(/^chapter(\d+)\.html$/)
    if (chapterMatch) return { key: `ch${chapterMatch[1]}`, params }

    const pageRoutes = {
      'inventory.html': 'inventory',
      'skills.html': 'skills',
      'trader.html': 'trader',
      'lobby.html': 'lobby',
      'badges.html': 'badges',
      'crafting.html': 'crafting',
      'garage.html': 'garage',
      'vehicle.html': 'vehicle',
      'The_Watcher.html': 'the-watcher',
      'Twin_Judges.html': 'twin-judges',
      'book.html': 'chapters',
    }

    return { key: pageRoutes[file] || null, params }
  }

  function routeUrl(route) {
    const url = new URL('book.html', location.href)
    route.params.forEach((value, key) => {
      if (key !== 'chapter' && key !== 'view') url.searchParams.set(key, value)
    })

    if (route.key === 'chapters') return url.pathname
    if (/^ch\d+$/.test(route.key)) url.searchParams.set('chapter', route.key.replace('ch', ''))
    else url.searchParams.set('view', route.key)

    return url.pathname + url.search
  }

  function updateNavActive(routeKey) {
    const currentView = /^ch\d+$/.test(routeKey) || routeKey === 'chapters' ? 'chapters' : routeKey
    document.querySelectorAll('.bm-link').forEach(link => {
      const route = routeFromUrl(new URL(link.href, location.href))
      const linkView = /^ch\d+$/.test(route.key) || route.key === 'chapters' ? 'chapters' : route.key
      link.classList.toggle('active', linkView === currentView)
    })
  }

  async function loadRoute(route, { push = false } = {}) {
    const tocView = document.getElementById('toc-view')
    const moduleView = document.getElementById('module-view')
    const host = document.getElementById('book-module-host')

    if (!route.key || route.key === 'chapters') {
      activeModule?.cleanup?.()
      activeModule = null
      host.innerHTML = ''
      document.querySelectorAll('style[data-book-module-style]').forEach(el => el.remove())
      tocView.hidden = false
      moduleView.hidden = true
      if (push) history.pushState({}, '', routeUrl({ ...route, key: 'chapters' }))
      updateNavActive('chapters')
      return
    }

    const loader = MODULE_ROUTES[route.key]
    if (!loader) {
      window.location.href = routeUrl({ ...route, key: 'chapters' })
      return
    }

    if (push) history.pushState({}, '', routeUrl(route))
    updateNavActive(route.key)

    tocView.hidden = true
    moduleView.hidden = false
    activeModule?.cleanup?.()
    host.innerHTML = '<div class="module-loading">Opening module...</div>'

    try {
      const mod = await loader()
      const mount = mod.default || mod.mount
      if (typeof mount !== 'function') throw new Error(`Module "${route.key}" does not export a mount function.`)

      // Re-assign this before every mount because chapter scripts use window.goTo
      // for story nodes. The book router needs its own stable global.
      window.bookNavigate = bookNavigate
      activeModule = await mount({
        host,
        player: currentPlayer,
        navId: 'nav',
        navigate: bookNavigate,
      })
    } catch (err) {
      console.error('[SuperSede] Failed to open book module:', route.key, err)
      host.innerHTML = `<div class="module-loading">
        Failed to open ${route.key}.<br>
        <span style="display:block;margin-top:10px;font-size:9px;letter-spacing:.08em;text-transform:none">${err?.message || err}</span>
        <button class="ch-btn" style="margin-top:16px" onclick="window.bookNavigate('book.html')">Return to Chapters</button>
      </div>`
    }
  }

  function bookNavigate(href) {
    const url = new URL(href, location.href)
    const route = routeFromUrl(url)
    if (route.key) {
      loadRoute(route, { push: true })
      return
    }
    window.location.href = href

        <path d="M 478 92 a 7 7 0 1 0 14 0"/>
        <path d="M 500 100 a 7 7 0 0 1 -12 -2"/>
        <path d="M 525 118 a 7 7 0 0 1 -12 -4"/>
      </g>
    </g>
    <!-- CENTER seam + scales -->
    <line x1="400" y1="90" x2="400" y2="860" stroke="#f4c45a" stroke-opacity="0.22" stroke-width="0.6"/>
    <g transform="translate(400 430)">
      <circle cx="0" cy="0" r="16" fill="#0a0812" stroke="#f4c45a" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffb347"/>
      <line x1="-100" y1="22" x2="100" y2="22" stroke="#f4c45a" stroke-width="1.6"/>
      <path d="M -100 22 L -112 74" stroke="url(#tj-chain)" stroke-width="1.2" fill="none"/>
      <path d="M 100 22 L 112 74" stroke="url(#tj-chain)" stroke-width="1.2" fill="none"/>
      <path d="M -138 76 Q -112 114,-86 76 Z" fill="#0e1816" stroke="#7fd6a6" stroke-width="1.2"/>
      <circle cx="-112" cy="82" r="7" fill="#7fd6a6" opacity="0.95"/>
      <path d="M 86 76 Q 112 114,138 76 Z" fill="#180c0e" stroke="#e8564a" stroke-width="1.2"/>
      <circle cx="112" cy="82" r="7" fill="#e8564a" opacity="0.95"/>
      <line x1="0" y1="-16" x2="0" y2="-42" stroke="url(#tj-chain)" stroke-width="1.2"/>
      <polygon points="-7,-42 7,-42 0,-52" fill="#f4c45a" opacity="0.9"/>
    </g>
    <!-- shared halo -->
    <ellipse cx="400" cy="205" rx="220" ry="32" fill="none" stroke="#f4c45a" stroke-width="0.6" stroke-dasharray="1 6" opacity="0.55"/>
  </svg>`

  const CH_COVERS = { 1: WATCHER_SVG, 2: TWIN_JUDGES_SVG }

  ;(async () => {
    const player = await renderNav('nav')
    if (!player) return
    currentPlayer = player

    const unlocked = player.chapters_unlocked || [1]

    document.getElementById('rec-username').textContent = player.username
    document.getElementById('rec-stats').innerHTML = [
      ['Level',   player.level],
      ['XP',      player.xp],
      ['HP',      `${player.hp}/${player.max_hp}`],
      ['Gold',    `◈ ${player.gold}`],
      ['Rep',     player.reputation || 'neutral'],
      ['Element', player.element || '—'],
    ].map(([k, v]) => {
      const c = { HP:'ice', Gold:'amber', Element:'ice', Rep:'green' }
      return `<div class="stat-cell">
        <span class="stat-k">${k}</span>
        <span class="stat-v ${c[k]||''}">${v}</span>
      </div>`
    }).join('')

    // Chapter preview pages map (add entries as chapters get preview pages)
    const CH_PREVIEW = { 1: 'book.html?view=the-watcher', 2: 'book.html?view=twin-judges' }

    document.getElementById('chapter-list').innerHTML = CHAPTERS.map(ch => {
      const isUnlocked = unlocked.includes(ch.number)
      const previewHref = CH_PREVIEW[ch.number]
      const chNumLabel = `<span style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.22em;color:var(--gold);display:block;margin-bottom:3px;text-transform:uppercase">Ch.${String(ch.number).padStart(2,'0')}</span>`

      const thumbBg = ch.number === 2
        ? 'radial-gradient(ellipse at 50% 38%, #1a1620 0%, #0b0a10 60%, #050409 100%)'
        : 'radial-gradient(ellipse at 50% 38%, #0e2030 0%, #04080e 60%, #020305 100%)'

      const thumbInner = CH_COVERS[ch.number]
        ? CH_COVERS[ch.number]
        : `<div style="display:flex;align-items:center;justify-content:center;height:100%"><span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:#3a4354">Ch.${String(ch.number).padStart(2,'0')}</span></div>`

      // Preview is always clickable if it exists — regardless of chapter lock
      const thumbHtml = previewHref
          ? `<a href="${previewHref}" class="ch-thumb" title="View Chapter ${ch.number} preview" style="display:block;cursor:pointer;text-decoration:none;background:${thumbBg}" onclick="event.preventDefault();bookNavigate('${previewHref}')">${thumbInner}</a>`
        : `<div class="ch-thumb" style="background:${thumbBg}">${thumbInner}</div>`

      if (!isUnlocked) {
        return `<div class="chapter-entry locked">
          ${thumbHtml}
          <div class="ch-info">
            ${chNumLabel}
            <div class="ch-title">${ch.title}</div>
            <div class="ch-sub">${ch.sub}</div>
          </div>
          <span class="ch-sealed">Sealed</span>
        </div>`
      }

      const isCh1       = ch.number === 1
      const alreadyIn   = (player.current_node || '').startsWith(`ch${ch.number}_`)
      const chUnlocked  = unlocked.includes(ch.number)
      const isReplay    = unlocked.includes(ch.number + 1)

      // Ch1 — single button only
      if (isCh1) {
        const href  = 'book.html?chapter=1'
        const label = player.current_chapter === 1 || alreadyIn ? 'Continue ›' : isReplay ? 'Replay ›' : 'Enter ›'
        return `<div class="chapter-entry">
          ${thumbHtml}
          <div class="ch-info">
            ${chNumLabel}
            <div class="ch-title">${ch.title}</div>
            <div class="ch-sub">${ch.sub}</div>
          </div>
          <a href="${href}" class="ch-btn ${player.current_chapter===1?'active':''}"
             onclick="event.preventDefault();bookNavigate('${href}')">${label}</a>
        </div>`
      }

      // Ch2+ — always show Drive button + Chapter button (chapter locked until drive done)
      const driveLabel = 'Drive ›'
      const chLabel    = alreadyIn || player.current_chapter === ch.number ? 'Continue ›'
                       : isReplay ? 'Replay ›' : 'Enter ›'
      const chHref     = `book.html?chapter=${ch.number}`
      const chDisabled = !chUnlocked

      return `<div class="chapter-entry">
        ${thumbHtml}
        <div class="ch-info">
          ${chNumLabel}
          <div class="ch-title">${ch.title}</div>
          <div class="ch-sub">${ch.sub}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
          <a href="book.html?view=garage&dest=${ch.number}" class="ch-btn"
             onclick="event.preventDefault();bookNavigate('book.html?view=garage&dest=${ch.number}')">${driveLabel}</a>
          ${chDisabled
            ? `<span class="ch-btn" style="opacity:.35;cursor:not-allowed;pointer-events:none" title="Complete the drive to unlock">🔒 Chapter</span>`
            : `<a href="${chHref}" class="ch-btn ${player.current_chapter===ch.number?'active':''}"
                 onclick="event.preventDefault();bookNavigate('${chHref}')">${chLabel}</a>`
          }
        </div>
      </div>`
    }).join('')

    // expose for inline onclick
    window.bookNavigate = bookNavigate
    document.getElementById('book-module-host').addEventListener('click', (event) => {
      const link = event.target.closest('a[href]')
      if (!link) return
      const href = link.getAttribute('href')
      const route = routeFromUrl(new URL(href, location.href))
      if (!route.key) return
      event.preventDefault()
      bookNavigate(href)
    })
    window.addEventListener('popstate', () => loadRoute(routeFromUrl(new URL(location.href)), { push: false }))
    await loadRoute(routeFromUrl(new URL(location.href)), { push: false })
  })()
</script>
</body>
</html>
