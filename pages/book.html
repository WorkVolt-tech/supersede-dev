<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSede — Chapters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════
       PARCHMENT BOOK THEME — Warm Ink / Aged Paper
       Matches the interactive book page-flip UI.
    ══════════════════════════════════════════════ */
       :root {
      --bg-0:      #14110f;
      --bg-1:      #2b1d16;
      --panel:     #f4ead7;
      --page-l:    #f4ead7;
      --page-r:    #f1e4cf;
      --ink:       #2b1d16;
      --ink-dim:   #5c4638;
      --ink-faint: #a08060;
      --ice:       #7a5230;
      --ice-hot:   #4b2e14;
      --gold:      #c8a050;
      --gold-hot:  #e0c070;
      --gold-dim:  #a08040;
      --amber:     #d09040;
      --amber-hot: #e0a050;
      --warn:      #e06050;
      --line:      rgba(200,160,80,.30);
      --green:     #5cae50;
      --purple:    #8a50c0;
      --spine-col: #2b1d16;
    }
    *, *::before, *::after { box-sizing: border-box; }

    /* ── Nav ── */
    #nav { position: relative; z-index: 200; }
    #nav, #nav * { background: transparent !important; box-shadow: none !important; border-radius: 0 !important; }
    #nav a, #nav button {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 10px !important; letter-spacing: .28em !important;
      text-transform: uppercase !important; color: var(--ink-dim) !important;
      text-decoration: none !important; border: none !important; padding: 0 !important;
      transition: color .2s !important;
    }
    #nav a:hover, #nav button:hover { color: var(--gold) !important; }
    #nav > *, #nav nav, #nav div {
      border-bottom: 1px solid var(--line) !important;
      padding: 14px 32px !important; display: flex !important;
      align-items: center !important; gap: 28px !important; flex-wrap: wrap !important;
    }

    /* ── Global reset ── */
    html, body {
      background: radial-gradient(ellipse at 50% 0%, #2a1a0e 0%, #14110f 55%, #0d0b09 100%) !important;
      color: var(--ink) !important;
      font-family: 'Cormorant Garamond', Georgia, serif !important;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Warm ambient glow */
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9998;
      background: radial-gradient(ellipse 900px 900px at 50% 40%, rgba(180,120,60,.07) 0%, transparent 70%);
    }

    /* ── Book wrap ── */
    .book-wrap {
      background: transparent !important;
      max-width: 1060px;
      margin: 0 auto;
      padding: 24px 24px 60px;
    }

    /* ── Book — warm parchment open-book ── */
    .book {
      display: grid !important;
      grid-template-columns: 1fr 22px 1fr !important;
      align-items: stretch !important;
      gap: 0 !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 24px !important;
      filter: drop-shadow(0 24px 60px rgba(0,0,0,.75)) drop-shadow(0 8px 20px rgba(0,0,0,.5)) !important;
      transform: perspective(1600px) rotateX(2.5deg) !important;
      transform-origin: 50% 0 !important;
      margin-top: 10px !important;
      overflow: hidden !important;
      border: 1px solid rgba(138,91,68,.30) !important;
    }
    @media(max-width: 860px) {
      .book { grid-template-columns: 1fr !important; transform: none !important; max-height: none !important; border-radius: 12px !important; }
      .spine { display: none !important; }
    }

    /* ── Pages ── */
    .parchment, .page-left, .page-right {
      background: var(--panel) !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      color: var(--ink) !important;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }
    /* Dot-texture paper grain */
    .page-left::before, .page-right::before {
      content: "" !important;
      position: absolute !important; inset: 0 !important;
      pointer-events: none !important; z-index: 0 !important;
      opacity: .08 !important;
      background-image: radial-gradient(circle, rgba(0,0,0,.25) 1px, transparent 1px) !important;
      background-size: 12px 12px !important;
    }
    .page-left  { border-right: none !important; background: var(--page-l) !important; }
    .page-right { border-left:  none !important; background: var(--page-r) !important; }

    /* Spine-edge shadow */
    .page-left::after {
      content: "" !important;
      position: absolute !important;
      top: 0 !important; bottom: 0 !important; right: 0 !important;
      width: 32px !important; height: auto !important;
      border: none !important;
      background: linear-gradient(270deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,.04) 50%, transparent 100%) !important;
      pointer-events: none !important;
      z-index: 2 !important;
    }
    .page-right::after {
      content: "" !important;
      position: absolute !important;
      top: 0 !important; bottom: 0 !important; left: 0 !important;
      width: 32px !important; height: auto !important;
      border: none !important;
      background: linear-gradient(90deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,.04) 50%, transparent 100%) !important;
      pointer-events: none !important;
      z-index: 2 !important;
    }

    /* Decorative corner brackets */
    .page-inner { padding: 28px 30px !important; position: relative; }
    .page-inner::before {
      content: "" !important;
      position: absolute !important;
      top: 14px !important; left: 14px !important;
      width: 28px !important; height: 28px !important;
      border-left: 1.5px solid rgba(138,91,68,.45) !important;
      border-top: 1.5px solid rgba(138,91,68,.45) !important;
      pointer-events: none !important;
    }
    .page-inner::after {
      content: "" !important;
      position: absolute !important;
      bottom: 14px !important; right: 14px !important;
      width: 28px !important; height: 28px !important;
      border-right: 1.5px solid rgba(138,91,68,.45) !important;
      border-bottom: 1.5px solid rgba(138,91,68,.45) !important;
      pointer-events: none !important;
    }
    .page-left  { border-right: none !important; background: var(--page-l) !important; }
    .page-right { border-left:  none !important; background: var(--page-r) !important; }

    .spine-inner, .spine-highlight, .spine-shadow,
    .spine-title, .spine-rule, .spine-diamond, .spine-chapter { display: none !important; }

    /* ── Chapter label / subtitle ── */
    .chapter-label {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 9.5px !important;
      letter-spacing: .42em !important;
      text-transform: uppercase !important;
      color: var(--gold) !important;
      margin-bottom: 5px !important;
    }
    .chapter-sub {
      font-size: 17px !important;
      font-style: italic !important;
      color: var(--ink-dim) !important;
      margin-bottom: 0 !important;
    }

        /* ── Divider ── */
    .ink-divider, hr.ink-divider {
      border: none !important;
      border-top: 1px solid rgba(200,180,120,.40) !important;
      margin: 12px 0 !important;
      opacity: 1 !important;
    }

    /* ── Body text colour remaps ── */
    p, li, span { color: var(--ink) !important; }
    [style*="color:var(--ink)"] { color: var(--ink) !important; }
    [style*="color:var(--ink-dim)"] { color: var(--ink-dim) !important; }
    [style*="color:#c8b96e"] { color: var(--gold) !important; }
    [style*="background:rgba(200,184,128"] { background: rgba(138,91,68,.08) !important; }
    [style*="border-color:rgba(139,106,32"] { border-color: rgba(138,91,68,.30) !important; }

    /* ── Story text ── */
    .story-text {
      font-family: 'Cormorant Garamond', serif !important;
      font-size: 17px !important;
      line-height: 1.65 !important;
      color: var(--ink) !important;
      white-space: pre-line !important;
    }
    .story-text.drop-cap::first-letter {
      font-size: 3.8em !important;
      float: left !important;
      line-height: .78 !important;
      margin: .05em .12em 0 0 !important;
      color: var(--gold) !important;
      font-weight: 600 !important;
    }

    /* ── Notice / outcome box ── */
    .notice-box {
      border: 1px solid rgba(200,180,120,.50) !important;
      background: rgba(30,20,15,.85) !important;
      color: #f0d060 !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 11px !important;
      letter-spacing: .06em !important;
      padding: 10px 14px !important;
      border-radius: 0 !important;
      margin-top: 14px !important;
    }

        /* ── HUD ── */
    #hud { color: #e8d8b0 !important; }
    #hud p, #hud span, #hud div { color: #e8d8b0 !important; }
    #hud .hud-badge-row .hud-seal-label { color: #f0d060 !important; }
    #hud .hud-chapter { color: #c8b880 !important; }
    #hud .stat-key { color: #c8b880 !important; font-family: 'JetBrains Mono',monospace !important; font-size: .6rem !important; letter-spacing: .08em !important; }
    #hud .stat-val { color: #f0e0c0 !important; }
    #hud .stat-bar-wrap { background: rgba(0,0,0,.08) !important; border-radius: 0 !important; }
    #hud .stat-box { background: rgba(0,0,0,.15) !important; border: 1px solid rgba(200,180,120,.35) !important; border-radius: 0 !important; }
    #hud .stat-box-key { color: #c8b880 !important; font-family: 'JetBrains Mono',monospace !important; }
    #hud .stat-box-val { color: #f0c080 !important; }
    #hud button {
      background: rgba(200,180,120,.12) !important;
      border-color: rgba(200,180,120,.40) !important;
      color: #e8d8b0 !important;
      border-radius: 0 !important;
      font-family: 'JetBrains Mono',monospace !important;
      transition: border-color .2s, color .2s !important;
    }
    #hud button:hover { border-color: #f0d060 !important; color: #f0d060 !important; }
    #hud div[onclick] {
      background: rgba(160,125,224,.15) !important;
      border-color: rgba(160,125,224,.40) !important;
      color: #e8d8b0 !important;
      border-radius: 0 !important;
    }

    /* ── Buttons / choices — warm parchment ── */
    button, .choice, .combat-btn {
      background: transparent !important;
      border: 1px solid rgba(138,91,68,.35) !important;
      border-radius: 0 !important;
      color: var(--ink) !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 10px !important; letter-spacing: .08em !important;
      cursor: pointer !important;
      transition: border-color .2s, color .2s, background .2s !important;
    }
    button:hover, .choice:hover, .combat-btn:hover:not(:disabled) {
      border-color: var(--gold) !important;
      color: var(--gold) !important;
      background: rgba(138,91,68,.07) !important;
    }

    /* ── Choices panel ── */
    .choices-label {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 10px !important;
      letter-spacing: .38em !important;
      text-transform: uppercase !important;
      color: var(--ink-dim) !important;
      margin-bottom: 12px !important;
    }
    .choices { display: flex; flex-direction: column; gap: 8px; }

    button.choice, .choice {
      background: rgba(244,234,215,.60) !important;
      border: 1px solid rgba(138,91,68,.35) !important;
      border-radius: 0 !important;
      color: var(--ink) !important;
      padding: 12px 14px !important;
      text-align: left !important;
      cursor: pointer !important;
      transition: border-color .2s, background .2s, transform .2s !important;
      display: flex !important;
      align-items: flex-start !important;
      gap: 10px !important;
      width: 100% !important;
      font-family: 'Cormorant Garamond', serif !important;
    }
    button.choice:hover, .choice:hover {
      border-color: var(--ice) !important;
      background: rgba(138,91,68,.12) !important;
      transform: translateX(4px) !important;
    }
    button.choice.danger, .choice.danger {
      border-color: rgba(192,57,43,.35) !important;
    }
    button.choice.danger:hover, .choice.danger:hover {
      border-color: var(--warn) !important;
      background: rgba(192,57,43,.08) !important;
    }
    button.choice.locked, .choice.locked {
      opacity: .45 !important;
      cursor: default !important;
      border-color: rgba(138,91,68,.15) !important;
    }
    .choice-arrow {
      color: var(--gold) !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      flex-shrink: 0 !important;
      margin-top: 1px !important;
    }
    button.choice.danger .choice-arrow, .choice.danger .choice-arrow { color: var(--warn) !important; }
    .choice-body {
      font-size: 17px !important;
      color: var(--ink) !important;
      display: flex !important;
      flex-direction: column !important;
    }
    .choice-sub {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 9.5px !important;
      letter-spacing: .06em !important;
      color: var(--ink-dim) !important;
      margin-top: 3px !important;
    }

    /* ── Stat bars ── */
    .stat-bar-wrap { background: rgba(0,0,0,.08) !important; border-radius: 0 !important; }
    .stat-key { color: var(--ink-dim) !important; font-family: 'JetBrains Mono',monospace !important; font-size: .58rem !important; letter-spacing: .08em !important; }
    .stat-val { color: var(--ink) !important; }

    /* ── Combat panel ── */
    .combat-panel {
      background: rgba(244,234,215,.80) !important;
      border: 1px solid rgba(138,91,68,.30) !important;
      border-radius: 0 !important;
      padding: 16px !important;
      position: relative;
    }
    .combat-panel::before {
      content: ""; position: absolute; top: -1px; left: -1px;
      width: 12px; height: 12px;
      border-top: 1px solid var(--gold); border-left: 1px solid var(--gold);
    }
    .combat-enemy-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .combat-enemy-icon { font-size: 2.5rem; }
    .combat-enemy-name {
      font-family: 'Cormorant Garamond', serif !important;
      font-size: 20px !important; font-weight: 600 !important;
      letter-spacing: .04em !important; color: var(--ink) !important;
    }
    .combat-log {
      font-family: 'Cormorant Garamond', serif !important;
      font-style: italic !important;
      font-size: 15px !important;
      line-height: 1.55 !important;
      color: var(--ink-dim) !important;
      background: rgba(0,0,0,.06) !important;
      border: 1px solid rgba(138,91,68,.20) !important;
      border-radius: 0 !important;
      padding: 10px 12px !important;
      min-height: 3rem !important;
      margin-bottom: 10px !important;
    }
    .combat-log em     { color: var(--gold) !important; font-style: italic; }
    .combat-log strong { color: var(--warn) !important; font-style: normal; }
    .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .stat-bar-wrap {
      flex: 1; height: 5px !important;
      background: rgba(0,0,0,.08) !important;
      border-radius: 0 !important; overflow: hidden;
    }
    .stat-bar { height: 100%; transition: width .4s, background .4s; }
    .stat-key {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: .58rem !important; letter-spacing: .08em !important;
      color: var(--ink-dim) !important; min-width: 44px;
    }
    .stat-val {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: .6rem !important; color: var(--ink) !important;
      min-width: 50px; text-align: right;
    }

    /* ── Combat action buttons ── */
    .combat-btn {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: .6rem !important; letter-spacing: .06em !important;
      color: var(--ink) !important;
      background: rgba(244,234,215,.50) !important;
      border: 1px solid rgba(138,91,68,.30) !important;
      border-radius: 0 !important;
      padding: .45rem .5rem !important;
      cursor: pointer !important;
      transition: border-color .2s, background .2s, color .2s !important;
      display: flex !important; align-items: center !important; justify-content: center !important;
    }
    .combat-btn:hover:not(:disabled) {
      border-color: var(--gold) !important;
      color: var(--gold) !important;
      background: rgba(138,91,68,.10) !important;
    }
    .combat-btn:disabled { opacity: .35 !important; cursor: not-allowed !important; }

    /* stat-grid inside HUD */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 4px; margin-top: 6px;
    }

    /* ── End screen ── */
    .end-box {
      background: rgba(244,234,215,.80) !important;
      border: 1px solid rgba(138,91,68,.30) !important;
      border-radius: 0 !important;
      padding: 20px !important;
      position: relative;
    }
    .end-box::before { content:""; position:absolute; top:-1px; left:-1px; width:14px; height:14px; border-top:1px solid var(--gold); border-left:1px solid var(--gold); }
    .end-box::after  { content:""; position:absolute; bottom:-1px; right:-1px; width:14px; height:14px; border-bottom:1px solid var(--gold); border-right:1px solid var(--gold); }
    .end-title {
      font-family: 'Cormorant Garamond', serif !important;
      font-size: 22px !important; font-weight: 600 !important;
      letter-spacing: .06em !important;
      color: var(--gold) !important;
      margin-bottom: 10px !important;
    }
    .end-sub {
      font-style: italic !important;
      font-size: 16px !important;
      color: var(--ink-dim) !important;
      line-height: 1.55 !important;
      margin-bottom: 14px !important;
    }
    .end-btn {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: .75rem !important;
      letter-spacing: .14em !important;
      text-transform: uppercase !important;
      color: var(--ink) !important;
      background: transparent !important;
      border: 1px solid rgba(138,91,68,.35) !important;
      border-radius: 0 !important;
      padding: .55rem 1.2rem !important;
      cursor: pointer !important;
      transition: border-color .2s, color .2s, background .2s !important;
      text-decoration: none !important;
      display: inline-block !important;
    }
    .end-btn:hover {
      border-color: var(--gold) !important;
      color: var(--gold) !important;
      background: rgba(138,91,68,.07) !important;
    }

    /* ── Items panel ── */
    #items-panel, [id$="-items-panel"] {
      background: rgba(244,234,215,.70) !important;
      border: 1px solid rgba(138,91,68,.25) !important;
      border-radius: 0 !important;
    }
    [id$="-items-panel"] p,
    [id$="-items-panel"] span { color: var(--ink) !important; }

    /* ── animate-in ── */
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .animate-in { animation: fadeIn .4s ease forwards; }
    @keyframes animateShake {
      0%,100%{transform:translateX(0)}
      20%,60%{transform:translateX(-4px)}
      40%,80%{transform:translateX(4px)}
    }
    .animate-shake { animation: animateShake .35s ease; }

    /* ── Items panel ── */
    #items-panel, [id$="-items-panel"] {
      background: rgba(244,234,215,.70) !important;
      border: 1px solid rgba(138,91,68,.25) !important;
      border-radius: 0 !important;
    }
    [id$="-items-panel"] p,
    [id$="-items-panel"] span { color: var(--ink) !important; }

    /* ── animate-in ── */
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .animate-in { animation: fadeIn .4s ease forwards; }
    @keyframes animateShake {
      0%,100%{transform:translateX(0)}
      20%,60%{transform:translateX(-4px)}
      40%,80%{transform:translateX(4px)}
    }
    .animate-shake { animation: animateShake .35s ease; }

        /* ── System overlay messages ── */
    .sys-overlay, [id="sys-overlay"] {
      background: rgba(20,15,10,.98) !important;
      border: 1px solid rgba(240,200,80,.70) !important;
      color: #f0e0a0 !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 11px !important;
      letter-spacing: .08em !important;
      border-radius: 4px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
      text-shadow: 0 0 2px rgba(0,0,0,0.5) !important;
    }
    .sys-overlay span, [id="sys-overlay"] span,
    .sys-overlay p, [id="sys-overlay"] p {
      color: #f0e0a0 !important;
    }

    /* ── Toast ── */
    .toast, [class*="toast"] {
      background: rgba(20,15,10,.98) !important;
      border: 1px solid rgba(240,200,80,.70) !important;
      color: #f0e0a0 !important;
      font-family: 'JetBrains Mono', monospace !important;
      border-radius: 4px !important;
      font-size: 11px !important;
      text-shadow: 0 0 2px rgba(0,0,0,0.5) !important;
    }
    .toast span, [class*="toast"] span,
    .toast p, [class*="toast"] p {
      color: #f0e0a0 !important;
    }

    /* ── Loot window ── */
    #loot-window {
      background: rgba(241,228,207,.96) !important;
      border-color: rgba(138,91,68,.40) !important;
      border-radius: 0 !important;
      color: var(--ink) !important;
    }
    #loot-window p, #loot-window span { color: var(--ink) !important; }

    /* ── Stat window modal ── */
    #stat-window > div {
      background: rgba(244,234,215,.97) !important;
      border: 1px solid rgba(138,91,68,.30) !important;
      border-radius: 0 !important;
    }
    #stat-window * { color: var(--ink) !important; }
    #stat-window [style*="background:rgba(200"] {
      background: rgba(138,91,68,.07) !important;
    }

    /* ── Judge image ── */
    #judge-img {
      border: 1px solid rgba(138,91,68,.30) !important;
      border-radius: 0 !important;
      filter: drop-shadow(0 0 20px rgba(138,91,68,.20)) !important;
    }

    /* ── combat-over ── */
    [id$="-combat-over"] { color: var(--ink) !important; }
    [id$="-combat-over"] button {

        rgba(0,0,0,.40) 46%,
        rgba(0,0,0,.50) 50%,

      width: 22px !important;
      min-width: 22px !important;
      margin: 0 !important;
      overflow: visible;
      box-shadow: none !important;
    }
    .spine::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 1px;
      transform: translateX(-50%);
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(43,29,22,.9) 8%,
        rgba(43,29,22,.9) 92%,
        transparent 100%);
      z-index: 2;
    }
    .spine::after {
      content: "";
      position: absolute;
      top: 2px; bottom: 2px; left: -3px;
      width: 3px;
      background: repeating-linear-gradient(
        180deg,
        rgba(138,91,68,.08) 0px,

        rgba(0,0,0,.10)     1px,

    /* ── Page-flip animation — triggered on navigation only ── */
    @keyframes bookPageFlip {
      0%   { transform: perspective(1200px) rotateY(0deg);    opacity: 0; }
      6%   { opacity: .92; }
      50%  { transform: perspective(1200px) rotateY(-180deg); opacity: .92; }

      // Preview is always clickable if it exists — regardless of chapter lock
      const thumbHtml = previewHref
        ? `<a href="${previewHref}" class="ch-thumb" title="View Chapter ${ch.number} preview" style="display:block;cursor:pointer;text-decoration:none;background:${thumbBg}" onclick="event.preventDefault();goTo('${previewHref}')">${thumbInner}</a>`
        : `<div class="ch-thumb" style="background:${thumbBg}">${thumbInner}</div>`

      if (!isUnlocked) {
        return `<div class="chapter-entry locked">
          ${thumbHtml}
          <div class="ch-info">
            ${chNumLabel}
            <div class="ch-title">${ch.title}</div>
            <div class="ch-sub">${ch.sub}</div>
          </div>
          <span class="ch-sealed">Sealed</span>
        </div>`
      }

      const isCh1       = ch.number === 1
      const alreadyIn   = (player.current_node || '').startsWith(`ch${ch.number}_`)
      const chUnlocked  = unlocked.includes(ch.number)
      const isReplay    = unlocked.includes(ch.number + 1)

      // Ch1 — single button only
      if (isCh1) {
        const href  = alreadyIn || player.current_chapter === 1 ? 'chapter1.html' : 'chapter1.html'
        const label = player.current_chapter === 1 || alreadyIn ? 'Continue ›' : isReplay ? 'Replay ›' : 'Enter ›'
        return `<div class="chapter-entry">
          ${thumbHtml}
          <div class="ch-info">
            ${chNumLabel}
            <div class="ch-title">${ch.title}</div>
            <div class="ch-sub">${ch.sub}</div>
          </div>
          <a href="${href}" class="ch-btn ${player.current_chapter===1?'active':''}"
             onclick="event.preventDefault();goTo('${href}')">${label}</a>
        </div>`
      }

      // Ch2+ — always show Drive button + Chapter button (chapter locked until drive done)
      const driveLabel = 'Drive ›'
      const chLabel    = alreadyIn || player.current_chapter === ch.number ? 'Continue ›'
                       : isReplay ? 'Replay ›' : 'Enter ›'
      const chHref     = `chapter${ch.number}.html`
      const chDisabled = !chUnlocked

      return `<div class="chapter-entry">
        ${thumbHtml}
        <div class="ch-info">
          ${chNumLabel}
          <div class="ch-title">${ch.title}</div>
          <div class="ch-sub">${ch.sub}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
          <a href="garage.html?dest=${ch.number}" class="ch-btn"
             onclick="event.preventDefault();goTo('garage.html?dest=${ch.number}')">${driveLabel}</a>
          ${chDisabled
            ? `<span class="ch-btn" style="opacity:.35;cursor:not-allowed;pointer-events:none" title="Complete the drive to unlock">🔒 Chapter</span>`
            : `<a href="${chHref}" class="ch-btn ${player.current_chapter===ch.number?'active':''}"
                 onclick="event.preventDefault();goTo('${chHref}')">${chLabel}</a>`
          }
        </div>
      </div>`
    }).join('')

    // expose for inline onclick
    window.goTo = goTo
  })()
</script>
</body>
</html>
