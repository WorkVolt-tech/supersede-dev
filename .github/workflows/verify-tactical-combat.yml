name: Verify tactical combat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tactical-combat.yml'
      - 'src/**'
      - 'tests/browser/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/verify-tactical-combat.yml'
      - 'src/**'
      - 'tests/browser/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  tactical-combat:
    name: Tactical combat tests and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Test tactical combat, progression, formations and status isolation
        run: |
          node --test \
            src/game/tacticalGrid.test.js \
            src/game/tacticalIntegration.test.js \
            src/game/tacticalGroups.test.js \
            src/game/tacticalFoeStatus.test.js \
            src/game/tacticalSkills.test.js \
            src/game/classElementFusion.test.js \
            src/game/singleFusionCombat.test.js \
            src/game/signatureFusion.test.js \
            src/game/elementalTriad.test.js
      - name: Build React application
        run: npm run build
      - name: Validate browser-test script syntax
        run: node --check tests/browser/group-combat-smoke.mjs
      - name: Install isolated Chromium smoke-test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live 3×3 group combat on desktop and mobile
        run: node tests/browser/group-combat-smoke.mjs
      - name: Test real 1v1 and boss fusion combat in Chromium
        run: node tests/browser/single-combat-smoke.mjs
      - name: Upload battlefield screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactical-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
